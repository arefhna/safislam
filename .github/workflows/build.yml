name: Build Saf Islam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP faylı tapılmadı."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP açıldı."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Android project axtarılır..."

          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tapılmadı."
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        shell: bash
        run: |
          echo "===== PROJECT ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Check Gradle wrapper
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper tapıldı."
            chmod +x "$PROJECT_DIR/gradlew"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "Gradle Wrapper ZIP-də yoxdur."
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        if: env.USE_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build with Gradle Wrapper
        if: env.USE_WRAPPER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build without Wrapper
        if: env.USE_WRAPPER == 'false'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saf-Islam-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
